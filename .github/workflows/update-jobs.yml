name: Update jobs

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check job boards
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DB: ${{ secrets.NOTION_COMPANIES_DB }}
        run: python scripts/fetch_jobs.py

      - name: Save new results
        run: |
          git config user.name "jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs"
            git push
          fi
