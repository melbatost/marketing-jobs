<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing internships</title>
<meta name="description" content="Paid marketing internships pulled straight from company job boards, updated every few hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf7f0; --card: #ffffff; --ink: #1f1b16; --muted: #6f675c; --line: #e8e0d2;
    --accent: #e0573a; --accent-soft: #fbe3da; --chip: #f2ece1; --good: #2f6f4f; --warn: #9a5b00; --warn-soft: #fbefd9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: clamp(34px, 5vw, 52px); line-height: 1.05; margin: 0 0 10px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .search { flex: 1 1 260px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font: inherit; color: inherit; }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 14px; color: var(--ink); user-select: none; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  select.chip { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 14px 16px; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-weight: 500; font-size: 13px; color: var(--muted); background: #fdfaf5; }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--ink); font-weight: 500; text-decoration: none; }
  td a:hover { color: var(--accent); text-decoration: underline; }
  .company { color: var(--ink); }
  .muted { color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.new { background: var(--accent-soft); color: #8a2d17; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .pay { white-space: nowrap; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  @media (max-width: 720px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border-bottom: 1px solid var(--line); padding: 12px 4px; }
    td { border: 0; padding: 2px 12px; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Marketing internships</h1>
  <p class="sub" id="sub">Loading roles…</p>

  <div class="controls" role="group" aria-label="Filters">
    <input class="search" id="q" type="search" placeholder="Search roles, companies or cities" aria-label="Search">
    <button class="chip" data-key="hideRemote" aria-pressed="true">Hide remote-only</button>
    <button class="chip" data-key="hideUnderFloor" aria-pressed="true">Hide under $20/hr</button>
    <button class="chip" data-key="hideB2BFinance" aria-pressed="true">Hide B2B finance</button>
    <button class="chip" data-key="hideB2B" aria-pressed="false">Hide B2B</button>
    <button class="chip" data-key="hideGrad" aria-pressed="true">Hide MBA/PhD</button>
    <select class="chip" id="window" aria-label="Added">
      <option value="all">Added any time</option>
      <option value="1">Added in last 24 hours</option>
      <option value="7">Added in last 7 days</option>
    </select>
  </div>

  <p class="count" id="count"></p>
  <table>
    <thead><tr><th>Role</th><th>Company</th><th>Pay</th><th>Location</th><th>Added</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <footer id="foot"></footer>
</main>

<script>
const DEFAULTS = { hideRemote: true, hideUnderFloor: true, hideB2BFinance: true, hideB2B: false, hideGrad: true, window: "all" };
let prefs = { ...DEFAULTS };
try { prefs = { ...DEFAULTS, ...JSON.parse(localStorage.getItem("mj-prefs") || "{}") }; } catch (e) {}
const save = () => { try { localStorage.setItem("mj-prefs", JSON.stringify(prefs)); } catch (e) {} };

let data = { jobs: [] };

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  const d = Math.round(s / 86400);
  return d === 1 ? "yesterday" : d + "d ago";
}
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const windowDays = prefs.window === "all" ? null : Number(prefs.window);
  const now = Date.now();
  const rows = data.jobs.filter((j) => {
    if (prefs.hideRemote && j.remote_only) return false;
    if (prefs.hideUnderFloor && j.under_floor) return false;
    if (prefs.hideB2BFinance && j.tags.includes("b2b-finance")) return false;
    if (prefs.hideB2B && (j.tags.includes("b2b") || j.tags.includes("b2b-finance"))) return false;
    if (prefs.hideGrad && j.grad_only) return false;
    if (windowDays && now - new Date(j.first_seen).getTime() > windowDays * 86400000) return false;
    if (q && !(j.title + " " + j.company + " " + j.location).toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById("count").textContent = `${rows.length} of ${data.jobs.length} roles`;
  const body = document.getElementById("rows");
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty">Nothing matches right now. Try turning off a filter.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map((j) => {
    const badges = [];
    if (now - new Date(j.first_seen).getTime() < 86400000) badges.push(`<span class="badge new">New</span>`);
    if (j.season) badges.push(`<span class="badge">${esc(j.season)}</span>`);
    if (j.remote_only) badges.push(`<span class="badge">Remote only</span>`);
    if (j.grad_only) badges.push(`<span class="badge">MBA/PhD</span>`);
    if (j.under_floor) badges.push(`<span class="badge warn">Under $${data.pay_floor}/hr</span>`);
    if (j.tags.includes("b2b-finance")) badges.push(`<span class="badge">B2B finance</span>`);
    else if (j.tags.includes("b2b")) badges.push(`<span class="badge">B2B</span>`);
    return `<tr>
      <td data-label="Role"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}</td>
      <td data-label="Company" class="company">${esc(j.company)}</td>
      <td data-label="Pay" class="pay ${j.pay ? "" : "muted"}">${esc(j.pay || "Not listed")}</td>
      <td data-label="Location" class="muted">${esc(j.location)}</td>
      <td data-label="Added" class="muted">${ago(j.first_seen)}</td>
    </tr>`;
  }).join("");
}

function syncControls() {
  document.querySelectorAll("[data-key]").forEach((b) => b.setAttribute("aria-pressed", String(!!prefs[b.dataset.key])));
  document.getElementById("window").value = prefs.window;
}

document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => {
  prefs[b.dataset.key] = !prefs[b.dataset.key]; save(); syncControls(); render();
}));
document.getElementById("window").addEventListener("change", (e) => { prefs.window = e.target.value; save(); render(); });
document.getElementById("q").addEventListener("input", render);
syncControls();

fetch("jobs.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((d) => {
    data = d;
    document.getElementById("sub").textContent =
      `Paid marketing internships pulled from ${d.companies_checked} company job boards. Updated ${ago(d.updated_at)}.`;
    const errs = (d.errors || []).length;
    document.getElementById("foot").innerHTML =
      `Checks every few hours. Listings link straight to each company's application page.` +
      (errs ? ` ${errs} job board${errs > 1 ? "s" : ""} didn't respond on the last check.` : "");
    render();
  })
  .catch(() => { document.getElementById("sub").textContent = "Couldn't load the roles. Try refreshing."; });
</script>
</body>
</html>
